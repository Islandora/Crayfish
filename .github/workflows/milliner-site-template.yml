name: Milliner site-template integration

on:
  pull_request:
    branches: [5.x]
    paths:
      - ".dockerignore"
      - "Milliner/**"
      - ".github/workflows/milliner-site-template.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milliner-site-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Drupal to Fcrepo6 lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TERM: xterm-256color
    steps:
      - name: Checkout site template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Islandora-Devops/isle-site-template
          ref: 91d2b491553be329f5b27f19fd7a9f1e2d71c101
          persist-credentials: false

      - name: Checkout Crayfish under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: crayfish
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Milliner from the pull request source
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "${{ steps.buildx.outputs.name }}" \
            --file crayfish/Milliner/tests/Integration/Dockerfile.site-template \
            --load \
            --tag local/milliner:ci \
            crayfish
          docker image inspect local/milliner:ci >/dev/null

      - name: Select local Milliner and Fcrepo6 main
        run: cp crayfish/Milliner/tests/Integration/site-template.override.yml docker-compose.override.yml

      - name: Install mkcert
        env:
          MKCERT_SHA256: 6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52
          MKCERT_VERSION: v1.4.4
        run: |
          set -euo pipefail
          mkcert_path="${RUNNER_TEMP}/mkcert"
          curl --fail --location --retry 3 \
            --output "$mkcert_path" \
            "https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64"
          printf '%s  %s\n' "$MKCERT_SHA256" "$mkcert_path" | sha256sum --check
          sudo install --mode 0755 "$mkcert_path" /usr/local/bin/mkcert

      - name: Start the ISLE site template
        run: |
          make overwrite-starter-site init up \
            ISLANDORA_TAG=main \
            STARTER_SITE_BRANCH=heads/main \
            STARTER_SITE_OWNER=Islandora-Devops \
            GITHUB_ACTIONS=true \
            TERM=xterm-256color
          ./scripts/ping.sh

      - name: Test Drupal to Milliner to Fedora lifecycle
        run: docker compose exec -T milliner composer integration:site-template

      - name: Collect service logs
        if: failure()
        run: |
          mkdir -p logs
          for service in drupal activemq alpaca milliner fcrepo; do
            docker compose logs --no-color --tail 500 "$service" >"logs/${service}.log" 2>&1 || true
          done

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: milliner-site-template-logs
          path: logs/*

      - name: Clean up site template
        if: always()
        run: docker compose down --volumes --remove-orphans
