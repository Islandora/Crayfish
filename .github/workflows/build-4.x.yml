name: CI - PHP 8.4 / Symfony 8.1

on:
  push:
    branches: [4.x, 5.x]
  pull_request:
    branches: [4.x, 5.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP 8.4
    defaults:
      run:
        working-directory: Milliner
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: xdebug

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit dependencies
        run: composer audit --locked --abandoned=fail

      - name: Check coding standards
        run: composer check

      - name: Test with coverage
        run: composer coverage
        env:
          XDEBUG_MODE: coverage

      - name: Upload coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: Milliner/clover.xml
          fail_ci_if_error: true

  fedora6-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Fcrepo6 main contract
    defaults:
      run:
        working-directory: Milliner
    services:
      activemq:
        image: islandora/activemq:main@sha256:d97a3ddbaa8495ec68cc7295cc54bbe63aa5ef3f5c5c44e71693c43cedf01c32
        options: >-
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      fcrepo:
        # Intentionally track main so Fedora compatibility regressions surface on Milliner changes.
        image: islandora/fcrepo6:main
        env:
          FCREPO_DISABLE_SYN: "true"
          FCREPO_PERSISTENCE_TYPE: file
          TOMCAT_ADMIN_NAME: admin
          TOMCAT_ADMIN_PASSWORD: password
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl --fail --silent --user admin:password http://localhost:8080/fcrepo/rest/fcr:systeminfo | jq -e .version"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test Milliner against Fcrepo6 main
        run: composer integration
        env:
          MILLINER_FEDORA6_URL: http://127.0.0.1:8080/fcrepo/rest
          MILLINER_FEDORA6_TOKEN: Basic YWRtaW46cGFzc3dvcmQ=

      - name: Show service logs on failure
        if: failure()
        working-directory: .
        run: |
          docker logs "${{ job.services.activemq.id }}" || true
          docker logs "${{ job.services.fcrepo.id }}" || true
