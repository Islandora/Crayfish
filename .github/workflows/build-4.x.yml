name: CI - PHP 8.4 / Symfony 8.1

on:
  push:
    branches: [4.x, 5.x]
  pull_request:
    branches: [4.x, 5.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP 8.4
    defaults:
      run:
        working-directory: Milliner
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit dependencies
        run: composer audit --locked --abandoned=fail

      - name: Check coding standards
        run: composer check

      - name: Test
        run: vendor/bin/phpunit --exclude-group integration

  fedora6-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Fcrepo6 main contract
    defaults:
      run:
        working-directory: Milliner
    services:
      activemq:
        image: islandora/activemq:main@sha256:08dd49e74bc2fe7c1734d37d4aa09a7324b7a8187763f391723eb23f161e08dd
        options: >-
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      fcrepo:
        # Intentionally track main so Fedora compatibility regressions surface on Milliner changes.
        image: islandora/fcrepo6:main
        env:
          FCREPO_DISABLE_SYN: "true"
          FCREPO_PERSISTENCE_TYPE: file
          TOMCAT_ADMIN_NAME: admin
          TOMCAT_ADMIN_PASSWORD: password
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl --fail --silent --user admin:password http://localhost:8080/fcrepo/rest/fcr:systeminfo | jq -e .version"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Test Milliner against Fcrepo6 main
        run: composer integration
        env:
          MILLINER_FEDORA6_URL: http://127.0.0.1:8080/fcrepo/rest
          MILLINER_FEDORA6_TOKEN: Basic YWRtaW46cGFzc3dvcmQ=

      - name: Show service logs on failure
        if: failure()
        working-directory: .
        run: |
          docker logs "${{ job.services.activemq.id }}" || true
          docker logs "${{ job.services.fcrepo.id }}" || true
